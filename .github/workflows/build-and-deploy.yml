name: Build and deploy
on: [push]
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        person:
          - slug: hendrik
            netlify_site_id: 11cf5515-4f97-4965-a552-6532b609d9f3
          - slug: anna
            netlify_site_id: 628f4d9f-ca27-4bf0-9c40-8ffbc4f4f66f
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4
      - name: Install dependencies
        run: npm install
      - name: Generate localized LaTeX templates
        run: npm run generate-latex
        env:
          NEXT_PUBLIC_PERSON: ${{ matrix.person.slug }}
      - name: Upload generated LaTeX templates
        uses: actions/upload-artifact@v4
        with:
          name: latex-templates
          path: cv/cv_*_*.tex
      - name: Compile LaTeX documents
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv/cv_*_*.tex
          continue_on_error: "true"
        env:
          TEXINPUTS: ".:./cv//:"
      - name: Upload generated PDF files
        uses: actions/upload-artifact@v4
        with:
          name: cvs
          path: |
            cv_*.pdf
            cv/*.pdf
      - name: Copy generated pdf files to public directory
        run: |
          mkdir -p public
          cp -R *.pdf public/ 2>/dev/null || true
          cp -R cv/*.pdf public/ 2>/dev/null || true
      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_PUBLIC_PERSON: ${{ matrix.person.slug }}
      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: './out'
          production-branch: master
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions"
          enable-pull-request-comment: true
          enable-commit-comment: true
          overwrites-pull-request-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ matrix.person.netlify_site_id }}
        timeout-minutes: 1
